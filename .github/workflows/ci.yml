name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Web build
        run: npm run build:web
      - name: No service-role key in the web bundle
        run: |
          if grep -rq "service_role" dist/; then
            echo "A service-role key reached the web bundle. It bypasses RLS."
            exit 1
          fi
          echo "OK: no service-role key in dist/"
